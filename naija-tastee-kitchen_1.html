<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Naija Tastee Kitchen — Authentic Nigerian meals delivered fresh in Benin City.">
  <title>Naija Tastee Kitchen — Authentic Nigerian Meals, Benin City</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🍛</text></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;0,700;0,900;1,400;1,600&family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;0,9..40,600;1,9..40,300&family=Cormorant+Garamond:ital,wght@0,400;0,500;1,400&display=swap" rel="stylesheet">
  <style>
/* =============================================
   NAIJA TASTEE KITCHEN — DESIGN SYSTEM
   ============================================= */

@import url('https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;0,700;0,900;1,400;1,600&family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;0,9..40,600;1,9..40,300&family=Cormorant+Garamond:ital,wght@0,400;0,500;1,400&display=swap');

/* === CSS VARIABLES === */
:root {
  --green: #2d6a4f;
  --green-light: #40916c;
  --green-pale: #d8f3dc;
  --green-dark: #1b4332;
  --green-darker: #081c15;
  --white: #ffffff;
  --cream: #faf7f2;
  --cream-dark: #f0ebe0;
  --gold: #e8a838;
  --gold-light: #f5c158;
  --text-dark: #1a1a1a;
  --text-mid: #3d3d3d;
  --text-light: #888;
  --shadow-sm: 0 2px 12px rgba(0,0,0,0.08);
  --shadow-md: 0 8px 32px rgba(0,0,0,0.12);
  --shadow-lg: 0 20px 60px rgba(0,0,0,0.18);
  --shadow-green: 0 8px 32px rgba(45, 106, 79, 0.25);
  --radius: 16px;
  --radius-sm: 8px;
  --radius-lg: 24px;
  --transition: all 0.35s cubic-bezier(0.4, 0, 0.2, 1);
  --font-display: 'Playfair Display', serif;
  --font-body: 'DM Sans', sans-serif;
  --font-accent: 'Cormorant Garamond', serif;
}

/* === RESET & BASE === */
*, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
html { scroll-behavior: smooth; font-size: 16px; }
body {
  font-family: var(--font-body);
  background: var(--white);
  color: var(--text-dark);
  overflow-x: hidden;
  line-height: 1.6;
}

/* === UTILITY === */
.container { max-width: 1200px; margin: 0 auto; padding: 0 24px; }
.section { padding: 100px 0; }
.section-label {
  font-family: var(--font-body);
  font-size: 11px;
  font-weight: 600;
  letter-spacing: 4px;
  text-transform: uppercase;
  color: var(--green);
  margin-bottom: 12px;
  display: flex;
  align-items: center;
  gap: 12px;
}
.section-label::before {
  content: '';
  display: block;
  width: 32px;
  height: 2px;
  background: var(--gold);
  flex-shrink: 0;
}
.section-title {
  font-family: var(--font-display);
  font-size: clamp(2rem, 4vw, 3.2rem);
  font-weight: 700;
  color: var(--text-dark);
  line-height: 1.15;
  margin-bottom: 20px;
}
.section-subtitle {
  font-size: 1.05rem;
  color: var(--text-light);
  max-width: 520px;
  line-height: 1.75;
}
.btn {
  display: inline-flex;
  align-items: center;
  gap: 10px;
  padding: 14px 28px;
  border-radius: 50px;
  font-family: var(--font-body);
  font-size: 0.9rem;
  font-weight: 600;
  letter-spacing: 0.3px;
  cursor: pointer;
  border: none;
  text-decoration: none;
  transition: var(--transition);
  position: relative;
  overflow: hidden;
}
.btn::after {
  content: '';
  position: absolute;
  inset: 0;
  background: rgba(255,255,255,0.15);
  opacity: 0;
  transition: opacity 0.25s;
}
.btn:hover::after { opacity: 1; }
.btn-primary {
  background: var(--green);
  color: var(--white);
  box-shadow: var(--shadow-green);
}
.btn-primary:hover {
  background: var(--green-dark);
  transform: translateY(-2px);
  box-shadow: 0 12px 40px rgba(45,106,79,0.4);
}
.btn-whatsapp {
  background: #25d366;
  color: var(--white);
  box-shadow: 0 8px 32px rgba(37,211,102,0.35);
}
.btn-whatsapp:hover {
  background: #128c7e;
  transform: translateY(-2px);
}
.btn-outline {
  background: transparent;
  color: var(--white);
  border: 2px solid rgba(255,255,255,0.6);
  backdrop-filter: blur(10px);
}
.btn-outline:hover {
  background: rgba(255,255,255,0.15);
  border-color: var(--white);
  transform: translateY(-2px);
}

/* === SCROLL REVEAL === */
.reveal {
  opacity: 0;
  transform: translateY(40px);
  transition: opacity 0.7s cubic-bezier(0.4, 0, 0.2, 1),
              transform 0.7s cubic-bezier(0.4, 0, 0.2, 1);
}
.reveal.visible { opacity: 1; transform: translateY(0); }
.reveal-left { opacity: 0; transform: translateX(-40px); transition: opacity 0.7s ease, transform 0.7s ease; }
.reveal-left.visible { opacity: 1; transform: translateX(0); }
.reveal-right { opacity: 0; transform: translateX(40px); transition: opacity 0.7s ease, transform 0.7s ease; }
.reveal-right.visible { opacity: 1; transform: translateX(0); }

/* =============================================
   LOADER
   ============================================= */
#loader {
  position: fixed;
  inset: 0;
  background: var(--green-darker);
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  z-index: 9999;
  transition: opacity 0.6s ease, visibility 0.6s ease;
}
#loader.hidden { opacity: 0; visibility: hidden; }
.loader-logo {
  font-family: var(--font-display);
  font-size: 2.5rem;
  font-weight: 700;
  color: var(--white);
  margin-bottom: 8px;
  animation: pulse 1.5s ease-in-out infinite;
}
.loader-sub {
  font-family: var(--font-body);
  font-size: 0.8rem;
  letter-spacing: 6px;
  text-transform: uppercase;
  color: var(--gold);
  margin-bottom: 40px;
}
.loader-bar {
  width: 200px;
  height: 3px;
  background: rgba(255,255,255,0.1);
  border-radius: 10px;
  overflow: hidden;
}
.loader-bar-fill {
  height: 100%;
  background: linear-gradient(90deg, var(--green), var(--gold));
  border-radius: 10px;
  animation: loadFill 1.8s ease-in-out forwards;
}
@keyframes loadFill { from { width: 0% } to { width: 100% } }
@keyframes pulse { 0%, 100% { opacity: 1 } 50% { opacity: 0.6 } }

/* =============================================
   NAVBAR
   ============================================= */
#navbar {
  position: fixed;
  top: 0;
  left: 0;
  right: 0;
  z-index: 1000;
  padding: 20px 0;
  transition: var(--transition);
}
#navbar.scrolled {
  background: rgba(255,255,255,0.96);
  backdrop-filter: blur(20px);
  -webkit-backdrop-filter: blur(20px);
  padding: 12px 0;
  box-shadow: 0 2px 30px rgba(0,0,0,0.08);
}
.nav-inner {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 24px;
}
.nav-logo {
  display: flex;
  align-items: center;
  gap: 10px;
  text-decoration: none;
}
.nav-logo-icon {
  width: 42px;
  height: 42px;
  background: var(--green);
  border-radius: 12px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 1.3rem;
  transition: var(--transition);
}
.nav-logo:hover .nav-logo-icon { transform: rotate(-8deg); background: var(--gold); }
.nav-logo-text { display: flex; flex-direction: column; line-height: 1; }
.nav-logo-name {
  font-family: var(--font-display);
  font-size: 1.15rem;
  font-weight: 700;
  color: var(--text-dark);
  transition: color 0.3s;
}
#navbar:not(.scrolled) .nav-logo-name { color: var(--white); }
.nav-logo-tagline {
  font-size: 0.65rem;
  letter-spacing: 2.5px;
  text-transform: uppercase;
  color: var(--gold);
  font-weight: 500;
}
.nav-links {
  display: flex;
  align-items: center;
  gap: 8px;
  list-style: none;
}
.nav-links a {
  font-size: 0.88rem;
  font-weight: 500;
  text-decoration: none;
  color: rgba(255,255,255,0.85);
  padding: 8px 14px;
  border-radius: 8px;
  transition: var(--transition);
}
#navbar.scrolled .nav-links a { color: var(--text-mid); }
.nav-links a:hover, #navbar.scrolled .nav-links a:hover {
  color: var(--green);
  background: var(--green-pale);
}
.nav-cta { margin-left: 8px; }
.nav-cta a {
  padding: 10px 20px !important;
  background: var(--green) !important;
  color: var(--white) !important;
  border-radius: 50px !important;
  font-weight: 600 !important;
}
.nav-cta a:hover { background: var(--green-dark) !important; transform: translateY(-1px); }

/* Hamburger */
.hamburger {
  display: none;
  flex-direction: column;
  gap: 5px;
  cursor: pointer;
  padding: 6px;
  background: none;
  border: none;
}
.hamburger span {
  display: block;
  width: 24px;
  height: 2px;
  background: var(--white);
  border-radius: 2px;
  transition: var(--transition);
}
#navbar.scrolled .hamburger span { background: var(--text-dark); }
.hamburger.open span:nth-child(1) { transform: translateY(7px) rotate(45deg); }
.hamburger.open span:nth-child(2) { opacity: 0; transform: scaleX(0); }
.hamburger.open span:nth-child(3) { transform: translateY(-7px) rotate(-45deg); }

/* Mobile Nav */
.mobile-nav {
  display: none;
  position: fixed;
  top: 0;
  right: -100%;
  width: 280px;
  height: 100vh;
  background: var(--white);
  z-index: 2000;
  padding: 80px 32px 40px;
  box-shadow: -20px 0 60px rgba(0,0,0,0.15);
  transition: right 0.4s cubic-bezier(0.4, 0, 0.2, 1);
  flex-direction: column;
  gap: 8px;
}
.mobile-nav.open { right: 0; display: flex; }
.mobile-nav a {
  font-size: 1.1rem;
  font-weight: 500;
  color: var(--text-mid);
  text-decoration: none;
  padding: 14px 0;
  border-bottom: 1px solid var(--cream-dark);
  transition: color 0.2s;
}
.mobile-nav a:hover { color: var(--green); }
.mobile-overlay {
  display: none;
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.5);
  z-index: 1999;
  backdrop-filter: blur(4px);
}
.mobile-overlay.active { display: block; }

/* =============================================
   HERO SECTION
   ============================================= */
#hero {
  min-height: 100vh;
  position: relative;
  display: flex;
  align-items: center;
  overflow: hidden;
}
.hero-bg {
  position: absolute;
  inset: 0;
  background: url('https://images.unsplash.com/photo-1567620905732-2d1ec7ab7445?w=1800&q=85') center/cover no-repeat;
  transform-origin: center;
  animation: heroZoom 20s ease-in-out infinite alternate;
}
@keyframes heroZoom { from { transform: scale(1) } to { transform: scale(1.06) } }
.hero-overlay {
  position: absolute;
  inset: 0;
  background: linear-gradient(
    135deg,
    rgba(8, 28, 21, 0.88) 0%,
    rgba(27, 67, 50, 0.75) 40%,
    rgba(8, 28, 21, 0.6) 100%
  );
}
.hero-content {
  position: relative;
  z-index: 2;
  max-width: 680px;
  padding-top: 80px;
}
.hero-badge {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  background: rgba(255,255,255,0.1);
  backdrop-filter: blur(10px);
  border: 1px solid rgba(255,255,255,0.2);
  color: var(--gold-light);
  font-size: 0.78rem;
  font-weight: 600;
  letter-spacing: 2.5px;
  text-transform: uppercase;
  padding: 8px 18px;
  border-radius: 50px;
  margin-bottom: 28px;
  opacity: 0;
  animation: fadeUp 0.8s ease 0.5s forwards;
}
.hero-title {
  font-family: var(--font-display);
  font-size: clamp(2.6rem, 6vw, 4.8rem);
  font-weight: 900;
  color: var(--white);
  line-height: 1.08;
  margin-bottom: 24px;
  opacity: 0;
  animation: fadeUp 0.9s ease 0.8s forwards;
}
.hero-title em {
  font-style: italic;
  color: var(--gold-light);
  display: block;
}
.hero-desc {
  font-size: 1.1rem;
  color: rgba(255,255,255,0.8);
  line-height: 1.8;
  margin-bottom: 40px;
  max-width: 500px;
  opacity: 0;
  animation: fadeUp 0.9s ease 1.1s forwards;
}
.hero-actions {
  display: flex;
  flex-wrap: wrap;
  gap: 14px;
  opacity: 0;
  animation: fadeUp 0.9s ease 1.4s forwards;
}
.hero-scroll-hint {
  position: absolute;
  bottom: 40px;
  left: 50%;
  transform: translateX(-50%);
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 8px;
  color: rgba(255,255,255,0.5);
  font-size: 0.7rem;
  letter-spacing: 2px;
  text-transform: uppercase;
  z-index: 2;
  animation: fadeUp 1s ease 2s both;
}
.scroll-mouse {
  width: 22px;
  height: 36px;
  border: 2px solid rgba(255,255,255,0.4);
  border-radius: 12px;
  display: flex;
  justify-content: center;
  padding-top: 6px;
}
.scroll-dot {
  width: 4px;
  height: 8px;
  background: rgba(255,255,255,0.7);
  border-radius: 2px;
  animation: scrollDot 2s ease-in-out infinite;
}
@keyframes scrollDot { 0%, 100% { transform: translateY(0); opacity: 1 } 60% { transform: translateY(8px); opacity: 0 } }
.hero-stats {
  position: absolute;
  right: 48px;
  bottom: 100px;
  display: flex;
  flex-direction: column;
  gap: 20px;
  z-index: 2;
  opacity: 0;
  animation: fadeLeft 1s ease 1.8s forwards;
}
.hero-stat {
  background: rgba(255,255,255,0.08);
  backdrop-filter: blur(20px);
  border: 1px solid rgba(255,255,255,0.15);
  border-radius: 16px;
  padding: 16px 20px;
  text-align: center;
}
.hero-stat-number {
  font-family: var(--font-display);
  font-size: 1.8rem;
  font-weight: 700;
  color: var(--gold-light);
  line-height: 1;
}
.hero-stat-label {
  font-size: 0.7rem;
  color: rgba(255,255,255,0.6);
  letter-spacing: 1px;
  text-transform: uppercase;
  margin-top: 4px;
}

@keyframes fadeUp { from { opacity: 0; transform: translateY(24px) } to { opacity: 1; transform: translateY(0) } }
@keyframes fadeLeft { from { opacity: 0; transform: translateX(24px) } to { opacity: 1; transform: translateX(0) } }

/* =============================================
   FEATURED SECTION
   ============================================= */
#featured { background: var(--cream); }
.featured-header {
  text-align: center;
  margin-bottom: 60px;
}
.featured-header .section-label { justify-content: center; }
.featured-header .section-label::before { display: none; }
.featured-header .section-label::after {
  content: '';
  display: block;
  width: 32px;
  height: 2px;
  background: var(--gold);
}
.featured-tabs {
  display: flex;
  justify-content: center;
  gap: 8px;
  margin-top: 32px;
  flex-wrap: wrap;
}
.tab-btn {
  padding: 10px 24px;
  border: 2px solid var(--cream-dark);
  border-radius: 50px;
  background: transparent;
  font-family: var(--font-body);
  font-size: 0.85rem;
  font-weight: 600;
  color: var(--text-light);
  cursor: pointer;
  transition: var(--transition);
}
.tab-btn.active, .tab-btn:hover {
  background: var(--green);
  border-color: var(--green);
  color: var(--white);
  transform: translateY(-2px);
  box-shadow: var(--shadow-green);
}
.featured-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
  gap: 28px;
}
.featured-card {
  background: var(--white);
  border-radius: var(--radius-lg);
  overflow: hidden;
  box-shadow: var(--shadow-sm);
  transition: var(--transition);
  cursor: pointer;
  position: relative;
}
.featured-card:hover {
  transform: translateY(-8px);
  box-shadow: var(--shadow-lg);
}
.featured-card-img {
  width: 100%;
  height: 220px;
  object-fit: cover;
  display: block;
  transition: transform 0.5s ease;
}
.featured-card:hover .featured-card-img { transform: scale(1.06); }
.featured-card-badge {
  position: absolute;
  top: 16px;
  left: 16px;
  background: var(--gold);
  color: var(--white);
  font-size: 0.7rem;
  font-weight: 700;
  letter-spacing: 1.5px;
  text-transform: uppercase;
  padding: 5px 12px;
  border-radius: 50px;
}
.featured-card-body { padding: 22px; }
.featured-card-name {
  font-family: var(--font-display);
  font-size: 1.2rem;
  font-weight: 600;
  color: var(--text-dark);
  margin-bottom: 6px;
}
.featured-card-desc { font-size: 0.85rem; color: var(--text-light); line-height: 1.6; margin-bottom: 16px; }
.featured-card-footer { display: flex; align-items: center; justify-content: space-between; }
.featured-card-price {
  font-family: var(--font-display);
  font-size: 1.3rem;
  font-weight: 700;
  color: var(--green);
}
.card-order-btn {
  width: 38px;
  height: 38px;
  background: var(--green-pale);
  border: none;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  font-size: 1rem;
  transition: var(--transition);
  color: var(--green);
}
.card-order-btn:hover { background: var(--green); color: var(--white); transform: scale(1.1); }

/* =============================================
   MENU SECTION
   ============================================= */
#menu { background: var(--white); }
.menu-layout { display: grid; grid-template-columns: 240px 1fr; gap: 48px; align-items: start; }
.menu-sidebar { position: sticky; top: 100px; }
.menu-sidebar-title {
  font-family: var(--font-display);
  font-size: 1.4rem;
  font-weight: 600;
  color: var(--text-dark);
  margin-bottom: 20px;
}
.menu-categories { list-style: none; display: flex; flex-direction: column; gap: 4px; }
.menu-cat-btn {
  display: flex;
  align-items: center;
  gap: 12px;
  width: 100%;
  padding: 14px 16px;
  background: transparent;
  border: none;
  border-radius: var(--radius-sm);
  font-family: var(--font-body);
  font-size: 0.9rem;
  font-weight: 500;
  color: var(--text-mid);
  cursor: pointer;
  transition: var(--transition);
  text-align: left;
}
.menu-cat-btn .cat-icon { font-size: 1.3rem; }
.menu-cat-btn.active, .menu-cat-btn:hover { background: var(--green-pale); color: var(--green); font-weight: 600; }
.menu-cat-btn.active { border-left: 3px solid var(--green); }
.menu-content-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 32px;
  flex-wrap: wrap;
  gap: 16px;
}
.menu-active-title {
  font-family: var(--font-display);
  font-size: 2rem;
  font-weight: 700;
  color: var(--text-dark);
}
.menu-search {
  display: flex;
  align-items: center;
  gap: 10px;
  background: var(--cream);
  border: 1.5px solid var(--cream-dark);
  border-radius: 50px;
  padding: 10px 18px;
  transition: var(--transition);
}
.menu-search:focus-within { border-color: var(--green); background: var(--white); }
.menu-search input {
  border: none;
  background: transparent;
  font-family: var(--font-body);
  font-size: 0.88rem;
  color: var(--text-dark);
  outline: none;
  width: 160px;
}
.menu-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
  gap: 24px;
  transition: opacity 0.3s ease;
}
.menu-card {
  background: var(--white);
  border: 1.5px solid var(--cream-dark);
  border-radius: var(--radius);
  overflow: hidden;
  transition: var(--transition);
  cursor: pointer;
}
.menu-card:hover { border-color: var(--green-light); transform: translateY(-4px); box-shadow: var(--shadow-md); }
.menu-card-img-wrap { position: relative; overflow: hidden; height: 180px; }
.menu-card-img { width: 100%; height: 100%; object-fit: cover; transition: transform 0.5s ease; }
.menu-card:hover .menu-card-img { transform: scale(1.08); }
.menu-card-overlay {
  position: absolute;
  inset: 0;
  background: linear-gradient(to top, rgba(8,28,21,0.7) 0%, transparent 60%);
  opacity: 0;
  transition: opacity 0.3s;
  display: flex;
  align-items: flex-end;
  padding: 16px;
}
.menu-card:hover .menu-card-overlay { opacity: 1; }
.menu-card-overlay-btn {
  width: 100%;
  padding: 10px;
  background: var(--white);
  border: none;
  border-radius: 8px;
  font-family: var(--font-body);
  font-size: 0.82rem;
  font-weight: 600;
  color: var(--green);
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
  transition: var(--transition);
}

// === ORDER VIA WHATSAPP ===
function orderOnWhatsApp(itemName = null) {
  const msg = itemName
    ? `Hello Naija Tastee Kitchen! 👋 I'd like to order *${itemName}*. Please share your full menu and delivery details. Thank you!`
    : `Hello Naija Tastee Kitchen! 👋 I'd like to place an order. Please share your menu and delivery options. Thank you!`;
  const url = `https://wa.me/${WHATSAPP_NUMBER}?text=${encodeURIComponent(msg)}`;
  window.open(url, '_blank');
}

function renderMenuItems(items) {
  return items.map((item, i) => `
    <div class="menu-card reveal" style="transition-delay:${i * 0.08}s">
      <div class="menu-card-img-wrap">
        <img class="menu-card-img" src="${item.img}" alt="${item.name}" loading="lazy">
        <div class="menu-card-overlay">
          <button class="menu-card-overlay-btn" onclick="orderOnWhatsApp('${item.name}')">
            📱 Order via WhatsApp
          </button>
        </div>
      </div>
      <div class="menu-card-body">
        <div class="menu-card-name">${item.name}</div>
        <div class="menu-card-desc">${item.desc}</div>
        <div class="menu-card-footer">
          <span class="menu-card-price">${item.price}</span>
          ${item.spicy ? '<span class="spicy-tag">🌶 Spicy</span>' : (item.badge ? `<span class="spicy-tag" style="background:#e8f5e9;color:#2d6a4f">${item.badge}</span>` : '')}
        </div>
      </div>
    </div>
  `).join('');
}

window.switchCategory = function(cat, btn) {
  activeCategory = cat;
  document.querySelectorAll('.menu-cat-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  const grid = document.getElementById('menuGrid');
  const title = document.getElementById('menuActiveTitle');
  title.textContent = cat;
  grid.style.opacity = '0';
  setTimeout(() => {
    grid.innerHTML = renderMenuItems(menuData[cat].items);
    grid.style.opacity = '1';
    initReveal();
  }, 200);
};

window.searchMenu = function(query) {
  const q = query.toLowerCase();
  const allItems = Object.values(menuData).flatMap(c => c.items);
  const results = q ? allItems.filter(i => i.name.toLowerCase().includes(q) || i.desc.toLowerCase().includes(q)) : menuData[activeCategory].items;
  const grid = document.getElementById('menuGrid');
  const title = document.getElementById('menuActiveTitle');
  title.textContent = q ? `Results for "${query}"` : activeCategory;
  grid.style.opacity = '0';
  setTimeout(() => {
    grid.innerHTML = results.length ? renderMenuItems(results) : '<p style="color:var(--text-light);font-size:.9rem;grid-column:1/-1">No items found. Try a different search.</p>';
    grid.style.opacity = '1';
    initReveal();
  }, 150);
};

// === SCROLL REVEAL ===
function initReveal() {
  const els = document.querySelectorAll('.reveal, .reveal-left, .reveal-right');
  const observer = new IntersectionObserver((entries) => {
    entries.forEach((entry, i) => {
      if (entry.isIntersecting) {
        setTimeout(() => entry.target.classList.add('visible'), i * 50);
        observer.unobserve(entry.target);
      }
    });
  }, { threshold: 0.12, rootMargin: '0px 0px -40px 0px' });
  els.forEach(el => observer.observe(el));
}

// === LOADER ===
function hideLoader() {
  const loader = document.getElementById('loader');
  setTimeout(() => loader.classList.add('hidden'), 1900);
}
