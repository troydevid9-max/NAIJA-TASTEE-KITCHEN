<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Naija Tastee Kitchen — Authentic Nigerian meals delivered fresh in Benin City.">
  <title>Naija Tastee Kitchen — Authentic Nigerian Meals, Benin City</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🍛</text></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;0,700;0,900;1,400;1,600&family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;0,9..40,600;1,9..40,300&family=Cormorant+Garamond:ital,wght@0,400;0,500;1,400&display=swap" rel="stylesheet">
  <style>
    /* =============================================
   NAIJA TASTEE KITCHEN — UPDATED DESIGN SYSTEM
   Professional tones · Fixed responsiveness
   ============================================= */

@import url('https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;0,700;0,900;1,400;1,600&family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;0,9..40,600;1,9..40,300&family=Cormorant+Garamond:ital,wght@0,400;0,500;1,400&display=swap');

/* === CSS VARIABLES — muted professional palette === */
:root {
  --green: #1e5c3a;          /* deeper, richer — less neon */
  --green-light: #2d7a52;    /* was #40916c — pulled back */
  --green-pale: #e8f5ee;     /* was #d8f3dc — softer */
  --green-dark: #143d27;     /* was #1b4332 — darker for contrast */
  --green-darker: #0a1f14;   /* was #081c15 — near-black green */
  --white: #ffffff;
  --cream: #f8f5f0;           /* slightly warmer */
  --cream-dark: #ede8dd;
  --gold: #b8851a;            /* was #e8a838 — less vivid, more refined */
  --gold-light: #d4a032;      /* was #f5c158 — toned down */
  --text-dark: #151515;
  --text-mid: #3a3a3a;
  --text-light: #7a7a7a;
  --shadow-sm: 0 2px 12px rgba(0,0,0,0.06);
  --shadow-md: 0 8px 28px rgba(0,0,0,0.10);
  --shadow-lg: 0 20px 50px rgba(0,0,0,0.14);
  --shadow-green: 0 6px 24px rgba(30, 92, 58, 0.20);  /* less intense */
  --radius: 14px;
  --radius-sm: 8px;
  --radius-lg: 20px;
  --transition: all 0.35s cubic-bezier(0.4, 0, 0.2, 1);
  --font-display: 'Playfair Display', serif;
  --font-body: 'DM Sans', sans-serif;
  --font-accent: 'Cormorant Garamond', serif;
}

/* === RESET & BASE === */
*, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
html { scroll-behavior: smooth; font-size: 16px; }
body {
  font-family: var(--font-body);
  background: var(--white);
  color: var(--text-dark);
  overflow-x: hidden;
  line-height: 1.6;
}

/* === UTILITY === */
.container { max-width: 1200px; margin: 0 auto; padding: 0 24px; }
.section { padding: 96px 0; }
.section-label {
  font-family: var(--font-body);
  font-size: 11px;
  font-weight: 600;
  letter-spacing: 3.5px;
  text-transform: uppercase;
  color: var(--green);
  margin-bottom: 12px;
  display: flex;
  align-items: center;
  gap: 12px;
}
.section-label::before {
  content: '';
  display: block;
  width: 28px;
  height: 2px;
  background: var(--gold);
  flex-shrink: 0;
}
.section-title {
  font-family: var(--font-display);
  font-size: clamp(1.9rem, 3.8vw, 3rem);
  font-weight: 700;
  color: var(--text-dark);
  line-height: 1.15;
  margin-bottom: 18px;
}
.section-subtitle {
  font-size: 1rem;
  color: var(--text-light);
  max-width: 500px;
  line-height: 1.8;
}
.btn {
  display: inline-flex;
  align-items: center;
  gap: 9px;
  padding: 13px 26px;
  border-radius: 50px;
  font-family: var(--font-body);
  font-size: 0.88rem;
  font-weight: 600;
  letter-spacing: 0.2px;
  cursor: pointer;
  border: none;
  text-decoration: none;
  transition: var(--transition);
  position: relative;
  overflow: hidden;
}
.btn::after {
  content: '';
  position: absolute;
  inset: 0;
  background: rgba(255,255,255,0.1);
  opacity: 0;
  transition: opacity 0.25s;
}
.btn:hover::after { opacity: 1; }
.btn-primary {
  background: var(--green);
  color: var(--white);
  box-shadow: var(--shadow-green);
}
.btn-primary:hover {
  background: var(--green-dark);
  transform: translateY(-2px);
  box-shadow: 0 10px 30px rgba(20, 61, 39, 0.28);
}
.btn-whatsapp {
  background: #1daa54;        /* subdued WhatsApp green vs pure neon */
  color: var(--white);
  box-shadow: 0 6px 22px rgba(29, 170, 84, 0.22);
}
.btn-whatsapp:hover {
  background: #178444;
  transform: translateY(-2px);
  box-shadow: 0 10px 28px rgba(29, 170, 84, 0.28);
}
.btn-outline {
  background: transparent;
  color: var(--white);
  border: 1.5px solid rgba(255,255,255,0.5);
  backdrop-filter: blur(8px);
}
.btn-outline:hover {
  background: rgba(255,255,255,0.12);
  border-color: rgba(255,255,255,0.8);
  transform: translateY(-2px);
}

/* === SCROLL REVEAL === */
.reveal {
  opacity: 0;
  transform: translateY(36px);
  transition: opacity 0.7s cubic-bezier(0.4, 0, 0.2, 1),
              transform 0.7s cubic-bezier(0.4, 0, 0.2, 1);
}
.reveal.visible { opacity: 1; transform: translateY(0); }
.reveal-left { opacity: 0; transform: translateX(-36px); transition: opacity 0.7s ease, transform 0.7s ease; }
.reveal-left.visible { opacity: 1; transform: translateX(0); }
.reveal-right { opacity: 0; transform: translateX(36px); transition: opacity 0.7s ease, transform 0.7s ease; }
.reveal-right.visible { opacity: 1; transform: translateX(0); }

/* =============================================
   LOADER
   ============================================= */
#loader {
  position: fixed;
  inset: 0;
  background: var(--green-darker);
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  z-index: 9999;
  transition: opacity 0.6s ease, visibility 0.6s ease;
}
#loader.hidden { opacity: 0; visibility: hidden; }
.loader-logo {
  font-family: var(--font-display);
  font-size: 2.2rem;
  font-weight: 700;
  color: var(--white);
  margin-bottom: 8px;
  animation: pulse 1.5s ease-in-out infinite;
}
.loader-sub {
  font-family: var(--font-body);
  font-size: 0.75rem;
  letter-spacing: 5px;
  text-transform: uppercase;
  color: var(--gold);
  margin-bottom: 40px;
}
.loader-bar {
  width: 180px;
  height: 2px;
  background: rgba(255,255,255,0.08);
  border-radius: 10px;
  overflow: hidden;
}
.loader-bar-fill {
  height: 100%;
  background: linear-gradient(90deg, var(--green-light), var(--gold));
  border-radius: 10px;
  animation: loadFill 1.8s ease-in-out forwards;
}
@keyframes loadFill { from { width: 0% } to { width: 100% } }
@keyframes pulse { 0%, 100% { opacity: 1 } 50% { opacity: 0.65 } }

/* =============================================
   NAVBAR
   ============================================= */
#navbar {
  position: fixed;
  top: 0;
  left: 0;
  right: 0;
  z-index: 1000;
  padding: 18px 0;
  transition: var(--transition);
}
#navbar.scrolled {
  background: rgba(255,255,255,0.97);
  backdrop-filter: blur(20px);
  -webkit-backdrop-filter: blur(20px);
  padding: 11px 0;
  box-shadow: 0 1px 24px rgba(0,0,0,0.07);
}
.nav-inner {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 24px;
}
.nav-logo {
  display: flex;
  align-items: center;
  gap: 10px;
  text-decoration: none;
  flex-shrink: 0;
}
.nav-logo-icon {
  width: 40px;
  height: 40px;
  background: var(--green);
  border-radius: 10px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 1.2rem;
  transition: var(--transition);
}
.nav-logo:hover .nav-logo-icon { transform: rotate(-8deg); background: var(--gold); }
.nav-logo-text { display: flex; flex-direction: column; line-height: 1; }
.nav-logo-name {
  font-family: var(--font-display);
  font-size: 1.1rem;
  font-weight: 700;
  color: var(--text-dark);
  transition: color 0.3s;
}
#navbar:not(.scrolled) .nav-logo-name { color: var(--white); }
.nav-logo-tagline {
  font-size: 0.6rem;
  letter-spacing: 2.5px;
  text-transform: uppercase;
  color: var(--gold);
  font-weight: 500;
}
.nav-links {
  display: flex;
  align-items: center;
  gap: 4px;
  list-style: none;
}
.nav-links a {
  font-size: 0.86rem;
  font-weight: 500;
  text-decoration: none;
  color: rgba(255,255,255,0.82);
  padding: 8px 13px;
  border-radius: 8px;
  transition: var(--transition);
  white-space: nowrap;
}
#navbar.scrolled .nav-links a { color: var(--text-mid); }
.nav-links a:hover, #navbar.scrolled .nav-links a:hover {
  color: var(--green);
  background: var(--green-pale);
}
.nav-cta { margin-left: 6px; }
.nav-cta a {
  padding: 9px 18px !important;
  background: var(--green) !important;
  color: var(--white) !important;
  border-radius: 50px !important;
  font-weight: 600 !important;
  white-space: nowrap;
}
.nav-cta a:hover { background: var(--green-dark) !important; transform: translateY(-1px); }

/* Hamburger */
.hamburger {
  display: none;
  flex-direction: column;
  gap: 5px;
  cursor: pointer;
  padding: 6px;
  background: none;
  border: none;
}
.hamburger span {
  display: block;
  width: 22px;
  height: 2px;
  background: var(--white);
  border-radius: 2px;
  transition: var(--transition);
}
#navbar.scrolled .hamburger span { background: var(--text-dark); }
.hamburger.open span:nth-child(1) { transform: translateY(7px) rotate(45deg); }
.hamburger.open span:nth-child(2) { opacity: 0; transform: scaleX(0); }
.hamburger.open span:nth-child(3) { transform: translateY(-7px) rotate(-45deg); }

/* Mobile Nav */
.mobile-nav {
  display: none;
  position: fixed;
  top: 0;
  right: -100%;
  width: 270px;
  height: 100vh;
  background: var(--white);
  z-index: 2000;
  padding: 76px 28px 40px;
  box-shadow: -16px 0 48px rgba(0,0,0,0.12);
  transition: right 0.4s cubic-bezier(0.4, 0, 0.2, 1);
  flex-direction: column;
  gap: 4px;
  overflow-y: auto;
}
.mobile-nav.open { right: 0; display: flex; }
.mobile-nav a {
  font-size: 1rem;
  font-weight: 500;
  color: var(--text-mid);
  text-decoration: none;
  padding: 13px 0;
  border-bottom: 1px solid var(--cream-dark);
  transition: color 0.2s;
}
.mobile-nav a:hover { color: var(--green); }
.mobile-overlay {
  display: none;
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.45);
  z-index: 1999;
  backdrop-filter: blur(4px);
}
.mobile-overlay.active { display: block; }

/* =============================================
   HERO SECTION
   ============================================= */
#hero {
  min-height: 100vh;
  position: relative;
  display: flex;
  align-items: center;
  overflow: hidden;
}
.hero-bg {
  position: absolute;
  inset: 0;
  background: url('https://images.unsplash.com/photo-1567620905732-2d1ec7ab7445?w=1800&q=85') center/cover no-repeat;
  transform-origin: center;
  animation: heroZoom 20s ease-in-out infinite alternate;
}
@keyframes heroZoom { from { transform: scale(1) } to { transform: scale(1.05) } }
.hero-overlay {
  position: absolute;
  inset: 0;
  background: linear-gradient(
    135deg,
    rgba(6, 22, 16, 0.92) 0%,
    rgba(20, 61, 39, 0.80) 45%,
    rgba(6, 22, 16, 0.68) 100%
  );
}
.hero-content {
  position: relative;
  z-index: 2;
  max-width: 660px;
  padding-top: 80px;
}
.hero-badge {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  background: rgba(255,255,255,0.08);
  backdrop-filter: blur(10px);
  border: 1px solid rgba(255,255,255,0.15);
  color: var(--gold-light);
  font-size: 0.75rem;
  font-weight: 600;
  letter-spacing: 2.5px;
  text-transform: uppercase;
  padding: 8px 16px;
  border-radius: 50px;
  margin-bottom: 26px;
  opacity: 0;
  animation: fadeUp 0.8s ease 0.5s forwards;
}
.hero-title {
  font-family: var(--font-display);
  font-size: clamp(2.4rem, 5.5vw, 4.4rem);
  font-weight: 900;
  color: var(--white);
  line-height: 1.08;
  margin-bottom: 22px;
  opacity: 0;
  animation: fadeUp 0.9s ease 0.8s forwards;
}
.hero-title em {
  font-style: italic;
  color: var(--gold-light);
  display: block;
}
.hero-desc {
  font-size: 1.05rem;
  color: rgba(255,255,255,0.75);
  line-height: 1.85;
  margin-bottom: 38px;
  max-width: 480px;
  opacity: 0;
  animation: fadeUp 0.9s ease 1.1s forwards;
}
.hero-actions {
  display: flex;
  flex-wrap: wrap;
  gap: 12px;
  opacity: 0;
  animation: fadeUp 0.9s ease 1.4s forwards;
}
.hero-scroll-hint {
  position: absolute;
  bottom: 36px;
  left: 50%;
  transform: translateX(-50%);
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 8px;
  color: rgba(255,255,255,0.4);
  font-size: 0.65rem;
  letter-spacing: 2px;
  text-transform: uppercase;
  z-index: 2;
  animation: fadeUp 1s ease 2s both;
}
.scroll-mouse {
  width: 20px;
  height: 33px;
  border: 1.5px solid rgba(255,255,255,0.35);
  border-radius: 12px;
  display: flex;
  justify-content: center;
  padding-top: 5px;
}
.scroll-dot {
  width: 3px;
  height: 7px;
  background: rgba(255,255,255,0.6);
  border-radius: 2px;
  animation: scrollDot 2s ease-in-out infinite;
}
@keyframes scrollDot { 0%, 100% { transform: translateY(0); opacity: 1 } 60% { transform: translateY(7px); opacity: 0 } }
.hero-stats {
  position: absolute;
  right: 48px;
  bottom: 96px;
  display: flex;
  flex-direction: column;
  gap: 16px;
  z-index: 2;
  opacity: 0;
  animation: fadeLeft 1s ease 1.8s forwards;
}
.hero-stat {
  background: rgba(255,255,255,0.07);
  backdrop-filter: blur(18px);
  border: 1px solid rgba(255,255,255,0.12);
  border-radius: 14px;
  padding: 14px 18px;
  text-align: center;
  min-width: 110px;
}
.hero-stat-number {
  font-family: var(--font-display);
  font-size: 1.65rem;
  font-weight: 700;
  color: var(--gold-light);
  line-height: 1;
}
.hero-stat-label {
  font-size: 0.68rem;
  color: rgba(255,255,255,0.55);
  letter-spacing: 1px;
  text-transform: uppercase;
  margin-top: 4px;
}

@keyframes fadeUp { from { opacity: 0; transform: translateY(22px) } to { opacity: 1; transform: translateY(0) } }
@keyframes fadeLeft { from { opacity: 0; transform: translateX(22px) } to { opacity: 1; transform: translateX(0) } }

/* =============================================
   FEATURED SECTION
   ============================================= */
#featured { background: var(--cream); }
.featured-header {
  text-align: center;
  margin-bottom: 56px;
}
.featured-header .section-label { justify-content: center; }
.featured-header .section-label::before { display: none; }
.featured-header .section-label::after {
  content: '';
  display: block;
  width: 28px;
  height: 2px;
  background: var(--gold);
}
.featured-tabs {
  display: flex;
  justify-content: center;
  gap: 8px;
  margin-top: 28px;
  flex-wrap: wrap;
}
.tab-btn {
  padding: 9px 20px;
  border: 1.5px solid var(--cream-dark);
  border-radius: 50px;
  background: transparent;
  font-family: var(--font-body);
  font-size: 0.82rem;
  font-weight: 600;
  color: var(--text-light);
  cursor: pointer;
  transition: var(--transition);
}
.tab-btn.active, .tab-btn:hover {
  background: var(--green);
  border-color: var(--green);
  color: var(--white);
  transform: translateY(-2px);
  box-shadow: var(--shadow-green);
}
.featured-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(290px, 1fr));
  gap: 24px;
}
.featured-card {
  background: var(--white);
  border-radius: var(--radius-lg);
  overflow: hidden;
  box-shadow: var(--shadow-sm);
  transition: var(--transition);
  cursor: pointer;
  position: relative;
}
.featured-card:hover {
  transform: translateY(-6px);
  box-shadow: var(--shadow-lg);
}
.featured-card-img {
  width: 100%;
  height: 210px;
  object-fit: cover;
  display: block;
  transition: transform 0.5s ease;
}
.featured-card:hover .featured-card-img { transform: scale(1.05); }
.featured-card-badge {
  position: absolute;
  top: 14px;
  left: 14px;
  background: var(--gold);
  color: var(--white);
  font-size: 0.68rem;
  font-weight: 700;
  letter-spacing: 1px;
  text-transform: uppercase;
  padding: 5px 11px;
  border-radius: 50px;
}
.featured-card-body { padding: 20px; }
.featured-card-name {
  font-family: var(--font-display);
  font-size: 1.15rem;
  font-weight: 600;
  color: var(--text-dark);
  margin-bottom: 6px;
}
.featured-card-desc { font-size: 0.83rem; color: var(--text-light); line-height: 1.65; margin-bottom: 14px; }
.featured-card-footer { display: flex; align-items: center; justify-content: space-between; }
.featured-card-price {
  font-family: var(--font-display);
  font-size: 1.25rem;
  font-weight: 700;
  color: var(--green);
}
.card-order-btn {
  width: 36px;
  height: 36px;
  background: var(--green-pale);
  border: none;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  font-size: 0.95rem;
  transition: var(--transition);
  color: var(--green);
}
.card-order-btn:hover { background: var(--green); color: var(--white); transform: scale(1.08); }

/* =============================================
   MENU SECTION
   ============================================= */
#menu { background: var(--white); }
.menu-layout { display: grid; grid-template-columns: 220px 1fr; gap: 44px; align-items: start; }
.menu-sidebar { position: sticky; top: 96px; }
.menu-sidebar-title {
  font-family: var(--font-display);
  font-size: 1.3rem;
  font-weight: 600;
  color: var(--text-dark);
  margin-bottom: 16px;
}
.menu-categories { list-style: none; display: flex; flex-direction: column; gap: 3px; }
.menu-cat-btn {
  display: flex;
  align-items: center;
  gap: 11px;
  width: 100%;
  padding: 12px 14px;
  background: transparent;
  border: none;
  border-radius: var(--radius-sm);
  font-family: var(--font-body);
  font-size: 0.88rem;
  font-weight: 500;
  color: var(--text-mid);
  cursor: pointer;
  transition: var(--transition);
  text-align: left;
}
.menu-cat-btn .cat-icon { font-size: 1.2rem; }
.menu-cat-btn.active, .menu-cat-btn:hover { background: var(--green-pale); color: var(--green); font-weight: 600; }
.menu-cat-btn.active { border-left: 3px solid var(--green); padding-left: 11px; }
.menu-content-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 28px;
  flex-wrap: wrap;
  gap: 14px;
}
.menu-active-title {
  font-family: var(--font-display);
  font-size: 1.85rem;
  font-weight: 700;
  color: var(--text-dark);
}
.menu-search {
  display: flex;
  align-items: center;
  gap: 9px;
  background: var(--cream);
  border: 1.5px solid var(--cream-dark);
  border-radius: 50px;
  padding: 9px 16px;
  transition: var(--transition);
}
.menu-search:focus-within { border-color: var(--green); background: var(--white); }
.menu-search input {
  border: none;
  background: transparent;
  font-family: var(--font-body);
  font-size: 0.85rem;
  color: var(--text-dark);
  outline: none;
  width: 150px;
}
.menu-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
  gap: 20px;
  transition: opacity 0.3s ease;
}
.menu-card {
  background: var(--white);
  border: 1.5px solid var(--cream-dark);
  border-radius: var(--radius);
  overflow: hidden;
  transition: var(--transition);
  cursor: pointer;
}
.menu-card:hover { border-color: var(--green-light); transform: translateY(-4px); box-shadow: var(--shadow-md); }
.menu-card-img-wrap { position: relative; overflow: hidden; height: 170px; }
.menu-card-img { width: 100%; height: 100%; object-fit: cover; transition: transform 0.5s ease; }
.menu-card:hover .menu-card-img { transform: scale(1.07); }
.menu-card-overlay {
  position: absolute;
  inset: 0;
  background: linear-gradient(to top, rgba(6,20,14,0.75) 0%, transparent 58%);

// === ORDER VIA WHATSAPP ===
function orderOnWhatsApp(itemName = null) {
  const msg = itemName
    ? `Hello Naija Tastee Kitchen! 👋 I'd like to order *${itemName}*. Please share your full menu and delivery details. Thank you!`
    : `Hello Naija Tastee Kitchen! 👋 I'd like to place an order. Please share your menu and delivery options. Thank you!`;
  const url = `https://wa.me/${WHATSAPP_NUMBER}?text=${encodeURIComponent(msg)}`;
  window.open(url, '_blank');
}

function renderMenuItems(items) {
  return items.map((item, i) => `
    <div class="menu-card reveal" style="transition-delay:${i * 0.08}s">
      <div class="menu-card-img-wrap">
        <img class="menu-card-img" src="${item.img}" alt="${item.name}" loading="lazy">
        <div class="menu-card-overlay">
          <button class="menu-card-overlay-btn" onclick="orderOnWhatsApp('${item.name}')">
            📱 Order via WhatsApp
          </button>
        </div>
      </div>
      <div class="menu-card-body">
        <div class="menu-card-name">${item.name}</div>
        <div class="menu-card-desc">${item.desc}</div>
        <div class="menu-card-footer">
          <span class="menu-card-price">${item.price}</span>
          ${item.spicy ? '<span class="spicy-tag">🌶 Spicy</span>' : (item.badge ? `<span class="spicy-tag" style="background:#e8f5e9;color:#2d6a4f">${item.badge}</span>` : '')}
        </div>
      </div>
    </div>
  `).join('');
}

window.switchCategory = function(cat, btn) {
  activeCategory = cat;
  document.querySelectorAll('.menu-cat-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  const grid = document.getElementById('menuGrid');
  const title = document.getElementById('menuActiveTitle');
  title.textContent = cat;
  grid.style.opacity = '0';
  setTimeout(() => {
    grid.innerHTML = renderMenuItems(menuData[cat].items);
    grid.style.opacity = '1';
    initReveal();
  }, 200);
};

window.searchMenu = function(query) {
  const q = query.toLowerCase();
  const allItems = Object.values(menuData).flatMap(c => c.items);
  const results = q ? allItems.filter(i => i.name.toLowerCase().includes(q) || i.desc.toLowerCase().includes(q)) : menuData[activeCategory].items;
  const grid = document.getElementById('menuGrid');
  const title = document.getElementById('menuActiveTitle');

// === SCROLL REVEAL ===
function initReveal() {
  const els = document.querySelectorAll('.reveal, .reveal-left, .reveal-right');
  const observer = new IntersectionObserver((entries) => {
    entries.forEach((entry, i) => {
      if (entry.isIntersecting) {
        setTimeout(() => entry.target.classList.add('visible'), i * 50);
        observer.unobserve(entry.target);
      }
    });
  }, { threshold: 0.12, rootMargin: '0px 0px -40px 0px' });
  els.forEach(el => observer.observe(el));
}

// === LOADER ===
function hideLoader() {
  const loader = document.getElementById('loader');
  setTimeout(() => loader.classList.add('hidden'), 1900);
}
